name: Wand CI

on:
  push:
    branches:
    - master
    tags:
    - '!*'
  pull_request:
    branches:
    - master

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y imagemagick
        python -m pip install --upgrade pip
        pip install --upgrade pytest pytest-cov coveralls
    - name: Run PyTest
      run: pytest --skip-pdf --cov wand
    - name: Generate coverage report
      run: coveralls --service=github-actions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.test-name }}
        COVERALLS_PARALLEL: true
  build_macos:
    name: Build MacOS
    runs-on: macos-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install ghostscript
        brew install imagemagick
        python -m pip install --upgrade pip
        pip install --upgrade pytest pytest-cov coveralls
    - name: Run PyTest
      run: pytest --skip-pdf --skip-fft --cov wand
      env:
        MAGICK_HOME: /opt/homebrew
    - name: Generate coverage report
      run: coveralls --service=github-actions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.test-name }}
        COVERALLS_PARALLEL: true
  coveralls:
    name: Indicate completion to coveralls.io
    needs: [build_linux, build_macos]
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
    - name: Finished
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade coveralls[yaml]
        coveralls --service=github-actions finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
