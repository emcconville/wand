name: Wand CI

on:
  push:
    branches:
    - master
    tags:
    - '!*'
  pull_request:
    branches:
    - master

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y imagemagick
        python -m pip install --upgrade pip
        pip install --upgrade pytest pytest-cov
    - name: Run PyTest
      run: pytest --skip-pdf --cov wand
    - name: Generate coverage report
      uses: coverallsapp/github-action@v2
      with:
        flag-name: py-${{ matrix.python-version }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel: true
  build_macos:
    name: Build MacOS
    runs-on: macos-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install ghostscript
        brew install imagemagick
        python -m pip install --upgrade pip
        pip install --upgrade pytest pytest-cov
    - name: Run PyTest
      run: pytest --skip-pdf --skip-fft --cov wand
      env:
        MAGICK_HOME: /opt/homebrew
  coveralls:
    name: Indicate completion to coveralls.io
    needs: [build_linux]
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
        carryforward: "py-3.12,py-3.13,py-3.14,py-3.15"
